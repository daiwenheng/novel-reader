name: NovelReader
options:
  bundleIdPrefix: com.daiwenheng
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  NovelReader:
    type: application
    platform: iOS
    sources:
      - path: NovelReader
        excludes:
          - Resources/Assets.xcassets
    resources:
      - path: NovelReader/Resources/Assets.xcassets
    dependencies:
      - package: ZIPFoundation
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 小说阅读
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daiwenheng.novelreader
        PRODUCT_NAME: NovelReader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
  NovelReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NovelReaderTests
    resources:
      - path: TestFixtures
    dependencies:
      - target: NovelReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daiwenheng.novelreader.tests
        GENERATE_INFOPLIST_FILE: YES
  NovelReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NovelReaderUITests
    dependencies:
      - target: NovelReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daiwenheng.novelreader.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NovelReader:
    build:
      targets:
        NovelReader: all
        NovelReaderTests: [test]
        NovelReaderUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: Fast.xctestplan
          defaultPlan: true
        - path: Full.xctestplan
    archive:
      config: Release
