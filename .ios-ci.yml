# ios-ci-workflows 的 App 配置，完整说明见 https://github.com/wenjinliuu/ios-ci-workflows/blob/main/docs/config.md
workdir: .
project: NovelReader.xcodeproj
scheme: NovelReader
bundle_id: com.daiwenheng.novelreader
display_name: 小说阅读
generate_command: xcodegen generate && python3 Scripts/sync-test-plans.py

toolchain:
  xcode: '26.6'
  simulator: iPhone 17 Pro
  ios: '26.4'

build_test:
  fast_test_plan: Fast
  full_test_plan: Full
  accessibility_audit: warn
  commit_recorded_snapshots: false
